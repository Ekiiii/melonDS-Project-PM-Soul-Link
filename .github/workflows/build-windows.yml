name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  MELONDS_GIT_BRANCH: ${{ github.ref }}
  MELONDS_GIT_HASH: ${{ github.sha }}
  MELONDS_BUILD_PROVIDER: GitHub Actions
#  MELONDS_VERSION_SUFFIX: " RC"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch:
          - name: x86_64
            image: windows-2025-vs2026

    name: ${{ matrix.arch.name }}
    runs-on: ${{ matrix.arch.image }}
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg_cache,readwrite
    steps:
    - name: Enable Windows Long Paths
      run: |
        New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
        git config --system core.longpaths true
        mkdir C:\b -ErrorAction SilentlyContinue
    - name: Check out sources
      uses: actions/checkout@v6
    - name: Restore vcpkg cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ github.workspace }}/vcpkg_cache
        key: vcpkg-${{ matrix.arch.name }}-windows-${{ hashFiles('vcpkg.json') }}
        restore-keys: vcpkg-${{ matrix.arch.name }}-windows-
    - name: Set up vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgJsonGlob: vcpkg.json
    - name: Build
      uses: lukka/run-cmake@v10
      with:
        configurePreset: release-windows-${{ matrix.arch.name }}
        configurePresetAdditionalArgs: "['-DENABLE_DEBUG_DEPS=OFF', '-DMELONDS_EMBED_BUILD_INFO=ON', '-DVCPKG_INSTALL_OPTIONS=--x-buildtrees-root=C:\\\\b']"
        buildPreset: release-windows-${{ matrix.arch.name }}
    - uses: actions/upload-artifact@v7
      with:
        name: melonDS-windows-${{ matrix.arch.name }}
        path: .\build\release-windows-${{ matrix.arch.name }}\melonDS.exe
    - name: Save vcpkg cache
      uses: actions/cache/save@v4
      with:
        path: ${{ github.workspace }}/vcpkg_cache
        key: vcpkg-${{ matrix.arch.name }}-windows-${{ hashFiles('vcpkg.json') }}
